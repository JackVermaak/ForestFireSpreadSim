name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      # The interface should at least build without a display.
      - run: MPLBACKEND=Agg python -c "import fire_spread_simulation as s; s.FireApp(seed=1)"
